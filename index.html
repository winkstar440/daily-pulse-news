<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Pulse | Auto-Updating News Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .serif { font-family: 'Playfair Display', serif; }
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    .dark .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); }
    /* Longer summary for Chinese preview cards */
    .summary-zh {
      display: -webkit-box;
      -webkit-line-clamp: 7;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.55;
    }
    .summary-en {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2 rounded-xl">
          <i data-lucide="newspaper" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="serif font-bold text-xl sm:text-2xl tracking-tight">DAILY PULSE</h1>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium tracking-wider uppercase">Auto-Updating Daily Hub</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-4">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="lang-en">Live News</span><span class="lang-zh hidden">即時新聞</span>
        </span>

        <button id="refresh-btn" onclick="fetchLiveNews(true)" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Force Refresh">
          <i data-lucide="refresh-cw" class="w-5 h-5"></i>
        </button>

        <button id="lang-btn" onclick="toggleLanguage()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
          中文
        </button>

        <button id="theme-btn" onclick="toggleTheme()" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    
    <!-- Category Tabs -->
    <div class="flex items-center space-x-2 overflow-x-auto pb-4 mb-6 border-b border-slate-200 dark:border-slate-800 no-scrollbar">
      <button onclick="setCategory('all')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-indigo-600 text-white" data-cat="all">
        <span class="lang-en">All News</span><span class="lang-zh hidden">所有新聞</span>
      </button>
      <button onclick="setCategory('horror')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700" data-cat="horror">
        <span class="lang-en">🎬 Horror Movies</span><span class="lang-zh hidden">🎬 好萊塢恐怖片</span>
      </button>
      <button onclick="setCategory('star')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700" data-cat="star">
        <span class="lang-en">⭐ Star & Celebrity</span><span class="lang-zh hidden">⭐ 明星八卦</span>
      </button>
      <button onclick="setCategory('fashion')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700" data-cat="fashion">
        <span class="lang-en">✨ Fashion & Style</span><span class="lang-zh hidden">✨ 時尚潮流</span>
      </button>
      <button onclick="setCategory('etf')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700" data-cat="etf">
        <span class="lang-en">📈 ETF & Finance</span><span class="lang-zh hidden">📈 ETF 與財經</span>
      </button>
      <button onclick="setCategory('ai')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700" data-cat="ai">
        <span class="lang-en">🤖 AI & Tech</span><span class="lang-zh hidden">🤖 人工智慧</span>
      </button>
    </div>

    <div class="text-xs text-slate-400 dark:text-slate-500 mb-6 flex items-center justify-between">
      <span><i data-lucide="clock" class="w-3.5 h-3.5 inline mr-1"></i> <span id="last-updated-text">Updating...</span></span>
      <span class="hidden sm:inline" id="auto-refresh-badge">
        <span class="lang-en">Auto-refreshes every 24 hours</span>
        <span class="lang-zh hidden">每 24 小時自動更新</span>
      </span>
    </div>

    <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="animate-pulse bg-white dark:bg-slate-900 rounded-2xl p-4 h-72 border border-slate-200 dark:border-slate-800"></div>
      <div class="animate-pulse bg-white dark:bg-slate-900 rounded-2xl p-4 h-72 border border-slate-200 dark:border-slate-800"></div>
      <div class="animate-pulse bg-white dark:bg-slate-900 rounded-2xl p-4 h-72 border border-slate-200 dark:border-slate-800"></div>
    </div>
  </main>

  <footer class="border-t border-slate-200 dark:border-slate-800 py-6 mt-12 text-center text-xs text-slate-500">
    <p>© 2026 Daily Pulse News · Powered by public RSS feeds</p>
  </footer>

  <script>
    let currentLang = 'en';
    let currentCategory = 'all';
    let articles = [];
    const translationCache = JSON.parse(localStorage.getItem('daily_trans_cache_v2') || '{}');

    // Reliable public RSS feeds (via CORS proxy)
    const PROXY = 'https://proxy.cors.dev/';
    const FEEDS = {
      horror:  [
        'https://bloody-disgusting.com/feed/',
        'https://ihorror.com/feed/'
      ],
      star: [
        'https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml',
        'https://www.hollywoodreporter.com/c/movies/feed/'
      ],
      fashion: [
        'https://www.vogue.com/feed/rss',
        'https://rss.nytimes.com/services/xml/rss/nyt/FashionandStyle.xml'
      ],
      etf: [
        'https://feeds.marketwatch.com/marketwatch/topstories/',
        'https://feeds.bbci.co.uk/news/business/rss.xml'
      ],
      ai: [
        'https://techcrunch.com/category/artificial-intelligence/feed/',
        'https://www.theverge.com/rss/ai-artificial-intelligence/index.xml',
        'https://www.technologyreview.com/feed/'
      ]
    };

    const CAT_INFO = {
      horror:  { en: 'Horror Movies', zh: '恐怖片',   color: 'bg-rose-500' },
      star:    { en: 'Star Gossip',   zh: '明星八卦', color: 'bg-amber-500' },
      fashion: { en: 'Fashion Trends',zh: '時尚潮流', color: 'bg-purple-500' },
      etf:     { en: 'ETF & Finance', zh: 'ETF 財經', color: 'bg-emerald-500' },
      ai:      { en: 'AI & Tech',     zh: '人工智慧', color: 'bg-sky-500' }
    };

    // Translate text using Google Translate unofficial endpoint
    async function translateText(text) {
      if (!text || text.length < 2) return text;
      const key = text.substring(0, 180);
      if (translationCache[key]) return translationCache[key];

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        let translated = '';
        if (data && data[0]) {
          data[0].forEach(part => { if (part[0]) translated += part[0]; });
        }
        if (translated) {
          translationCache[key] = translated;
          // Keep cache size reasonable
          const keys = Object.keys(translationCache);
          if (keys.length > 500) {
            keys.slice(0, 150).forEach(k => delete translationCache[k]);
          }
          localStorage.setItem('daily_trans_cache_v2', JSON.stringify(translationCache));
          return translated;
        }
      } catch (e) {
        console.warn('Translation failed', e);
      }
      return text;
    }

    function parseRSS(xmlText, category) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, 'text/xml');
      const items = xml.querySelectorAll('item');
      const results = [];

      items.forEach((item, idx) => {
        if (idx >= 8) return;
        const title = item.querySelector('title')?.textContent?.trim() || 'No title';
        const link = item.querySelector('link')?.textContent?.trim() || item.querySelector('link')?.getAttribute('href') || '#';

        // Get longer description for better Chinese summaries
        let rawDesc = item.querySelector('description')?.textContent 
                   || item.querySelector('content\\:encoded')?.textContent 
                   || item.querySelector('summary')?.textContent 
                   || '';

        // Clean HTML tags
        let cleanDesc = rawDesc.replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();

        // Keep a longer English version (for translation into Chinese)
        // Aim for ~480 characters so Chinese can reach 5+ lines
        let longDesc = cleanDesc.substring(0, 480).trim();
        if (cleanDesc.length > 480) longDesc += '...';

        // Short English snippet for English mode
        let shortDesc = cleanDesc.substring(0, 150).trim();
        if (cleanDesc.length > 150) shortDesc += '...';

        const pubDate = item.querySelector('pubDate')?.textContent;
        const date = pubDate ? new Date(pubDate).toLocaleDateString() : '';

        const source = xml.querySelector('channel > title')?.textContent?.trim() || 'News';

        results.push({
          id: (link || title) + idx,
          category,
          title,
          snippet: shortDesc,          // English short
          longSnippet: longDesc,       // Longer text used for Chinese translation
          url: link,
          date,
          source: source.replace(/ - .*$/, '').substring(0, 40),
          titleZh: null,
          snippetZh: null
        });
      });
      return results;
    }

    async function fetchLiveNews(force = false) {
      const btn = document.getElementById('refresh-btn');
      if (btn) btn.classList.add('animate-spin');

      // Bump cache version so old short snippets are discarded
      const cachedData = localStorage.getItem('daily_news_data_v4');
      const cachedTime = localStorage.getItem('daily_news_time_v4');
      const isExpired = !cachedTime || (Date.now() - parseInt(cachedTime)) > (24 * 60 * 60 * 1000);

      if (!force && cachedData && !isExpired) {
        articles = JSON.parse(cachedData);
        updateLastUpdatedText(new Date(parseInt(cachedTime)));
        await renderNews();
        if (btn) btn.classList.remove('animate-spin');
        return;
      }

      try {
        const allPromises = [];

        for (const [cat, urls] of Object.entries(FEEDS)) {
          for (const url of urls) {
            allPromises.push(
              fetch(PROXY + url)
                .then(r => r.text())
                .then(xml => parseRSS(xml, cat))
                .catch(err => {
                  console.warn('Feed failed:', url, err);
                  return [];
                })
            );
          }
        }

        const results = await Promise.all(allPromises);
        articles = results.flat().sort(() => Math.random() - 0.5);

        localStorage.setItem('daily_news_data_v4', JSON.stringify(articles));
        localStorage.setItem('daily_news_time_v4', Date.now().toString());
        updateLastUpdatedText(new Date());

      } catch (err) {
        console.error('Fetch error:', err);
      } finally {
        await renderNews();
        if (btn) btn.classList.remove('animate-spin');
      }
    }

    function updateLastUpdatedText(date) {
      const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateStr = date.toLocaleDateString();
      document.getElementById('last-updated-text').innerText =
        currentLang === 'en' ? `Updated: ${dateStr} ${timeStr}` : `更新時間: ${dateStr} ${timeStr}`;
    }

    async function renderNews() {
      const grid = document.getElementById('news-grid');
      const filtered = currentCategory === 'all'
        ? articles
        : articles.filter(a => a.category === currentCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 text-slate-400">
            <p class="mb-4 text-lg">${currentLang === 'en' ? 'No news available right now.' : '目前沒有新聞。'}</p>
            <button onclick="fetchLiveNews(true)" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition">
              ${currentLang === 'en' ? 'Click to Refresh' : '點擊重新整理'}
            </button>
          </div>`;
        return;
      }

      // Show skeleton while translating
      if (currentLang === 'zh') {
        grid.innerHTML = filtered.slice(0, 6).map(() =>
          `<div class="animate-pulse bg-white dark:bg-slate-900 rounded-2xl p-5 h-80 border border-slate-200 dark:border-slate-800"></div>`
        ).join('');
      }

      // Translate titles + longer snippets for Chinese mode
      if (currentLang === 'zh') {
        const toTranslate = filtered.filter(a => !a.snippetZh || !a.titleZh);
        for (let i = 0; i < toTranslate.length; i += 4) {
          const batch = toTranslate.slice(i, i + 4);
          await Promise.all(batch.map(async (item) => {
            if (!item.titleZh) {
              item.titleZh = await translateText(item.title);
            }
            if (!item.snippetZh) {
              // Use the longer English text for a richer Chinese summary
              const sourceText = item.longSnippet || item.snippet || item.title;
              item.snippetZh = await translateText(sourceText);
            }
          }));
        }
        localStorage.setItem('daily_news_data_v4', JSON.stringify(articles));
      }

      grid.innerHTML = filtered.map(item => {
        const cat = CAT_INFO[item.category];
        const catName = currentLang === 'en' ? cat.en : cat.zh;
        const displayTitle = currentLang === 'zh' && item.titleZh ? item.titleZh : item.title;
        const displaySnippet = currentLang === 'zh' && item.snippetZh 
          ? item.snippetZh 
          : (item.snippet || '');

        const summaryClass = currentLang === 'zh' ? 'summary-zh' : 'summary-en';

        return `
          <article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 hover:shadow-xl transition-all duration-300 flex flex-col justify-between min-h-[280px]">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold text-white ${cat.color}">
                  ${catName}
                </span>
                <span class="text-xs text-slate-400">${item.date}</span>
              </div>
              <h3 class="font-bold text-lg mb-2 line-clamp-2 text-slate-900 dark:text-slate-100 hover:text-indigo-600 transition">
                <a href="${item.url}" target="_blank" rel="noopener">${displayTitle}</a>
              </h3>
              <p class="text-sm text-slate-600 dark:text-slate-400 ${summaryClass} mb-4">
                ${displaySnippet}
              </p>
            </div>
            <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <span class="text-xs font-medium text-slate-400 truncate max-w-[140px]">${item.source}</span>
              <a href="${item.url}" target="_blank" rel="noopener" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1 shrink-0">
                ${currentLang === 'en' ? 'Read More' : '閱讀全文'} <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          </article>
        `;
      }).join('');

      lucide.createIcons();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "cat-btn px-4 py-2 rounded-full text-sm font-medium bg-indigo-600 text-white";
        } else {
          btn.className = "cat-btn px-4 py-2 rounded-full text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700";
        }
      });
      renderNews();
    }

    async function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'zh' : 'en';
      document.getElementById('lang-btn').innerText = currentLang === 'en' ? '中文' : 'English';

      document.querySelectorAll('.lang-en').forEach(el => el.classList.toggle('hidden', currentLang === 'zh'));
      document.querySelectorAll('.lang-zh').forEach(el => el.classList.toggle('hidden', currentLang === 'en'));

      const cachedTime = localStorage.getItem('daily_news_time_v4');
      if (cachedTime) updateLastUpdatedText(new Date(parseInt(cachedTime)));

      await renderNews();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      fetchLiveNews();
    });
  </script>
</body>
</html>
