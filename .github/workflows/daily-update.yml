name: Daily Trigger Refresh

on:
  schedule:
    # Runs at midnight (00:00 UTC) every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GitHub Pages
        run: |
          curl -s https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ > /dev/null
